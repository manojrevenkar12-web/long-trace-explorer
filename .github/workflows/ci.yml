name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: "Smoke test: ingest a trace over OTLP and open it"
        run: |
          npm run migrate
          (npm start > /tmp/next.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/traces > /dev/null && break; sleep 1; done
          npx tsx scripts/generate.ts 3000 | tee /tmp/gen.txt
          id=$(grep -o 'traces/[0-9a-f]\{32\}' /tmp/gen.txt | head -1 | cut -d/ -f2)
          curl -sf "http://127.0.0.1:3000/api/traces/$id/summary" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.meta.spans<3000)process.exit(1);console.log("opened",j.meta.spans,"spans")})'
